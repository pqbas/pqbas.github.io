<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="680" font-family="sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e67700"/></marker></defs>
<rect width="1500" height="680" fill="#fff"/><text x="750" y="38.0" font-size="28" text-anchor="middle" fill="#1e1e1e" font-weight="bold" xml:space="preserve">Secure by Design: recorre el request capa por capa</text><text x="750" y="70.0" font-size="17" text-anchor="middle" fill="#495057" font-style="italic" xml:space="preserve">las decisiones de seguridad se toman al diseñar la arquitectura, no se parchan al final</text><rect x="170" y="95" width="1170" height="395" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="2" stroke-dasharray="10 8"/><text x="190" y="125.0" font-size="18" text-anchor="start" fill="#7048e8" font-weight="bold" xml:space="preserve">6  INFRAESTRUCTURA  ·  ¿dónde corre?</text><text x="190" y="150.0" font-size="15" text-anchor="start" fill="#5f3dc4" xml:space="preserve">VPC privada + VPC endpoints  ·  IAM: un rol por servicio  ·  KMS + TLS  ·  Secrets Manager  ·  Bedrock en tu cuenta y región</text><rect x="20" y="185" width="120" height="70" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/><text x="80" y="226.0" font-size="20" text-anchor="middle" fill="#1e1e1e" font-weight="bold" xml:space="preserve">usuario</text><rect x="1365" y="185" width="115" height="70" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/><text x="1422" y="226.0" font-size="20" text-anchor="middle" fill="#1e1e1e" font-weight="bold" xml:space="preserve">usuario</text><line x1="140" y1="220" x2="186" y2="220" stroke="#1e1e1e" stroke-width="2.5" marker-end="url(#a)"/><rect x="190" y="175" width="190" height="90" rx="12" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="2"/><text x="285" y="212.0" font-size="19" text-anchor="middle" fill="#1e1e1e" font-weight="bold" xml:space="preserve">1  IDENTIDAD</text><text x="285" y="240.0" font-size="15" text-anchor="middle" fill="#495057" font-style="italic" xml:space="preserve">¿quién es?</text><text x="195" y="292.0" font-size="15" text-anchor="start" fill="#1e1e1e" xml:space="preserve">· Cognito / OAuth / JWT</text><text x="195" y="312.25" font-size="15" text-anchor="start" fill="#1e1e1e" xml:space="preserve">· user_id de la sesión,</text><text x="195" y="332.5" font-size="15" text-anchor="start" fill="#1e1e1e" xml:space="preserve">   nunca del LLM</text><line x1="380" y1="220" x2="416" y2="220" stroke="#1e1e1e" stroke-width="2.5" marker-end="url(#a)"/><line x1="285" y1="400" x2="285" y2="526" stroke="#e67700" stroke-width="2.5" marker-end="url(#g)" stroke-dasharray="6 6"/><rect x="420" y="175" width="190" height="90" rx="12" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/><text x="515" y="212.0" font-size="19" text-anchor="middle" fill="#1e1e1e" font-weight="bold" xml:space="preserve">2  ENTRADA</text><text x="515" y="240.0" font-size="15" text-anchor="middle" fill="#495057" font-style="italic" xml:space="preserve">¿qué entra?</text><text x="425" y="292.0" font-size="15" text-anchor="start" fill="#1e1e1e" xml:space="preserve">· guardrail G1</text><text x="425" y="312.25" font-size="15" text-anchor="start" fill="#1e1e1e" xml:space="preserve">· injection, alcance</text><text x="425" y="332.5" font-size="15" text-anchor="start" fill="#1e1e1e" xml:space="preserve">· input del usuario</text><text x="425" y="352.75" font-size="15" text-anchor="start" fill="#1e1e1e" xml:space="preserve">   como dato, no orden</text><line x1="610" y1="220" x2="646" y2="220" stroke="#1e1e1e" stroke-width="2.5" marker-end="url(#a)"/><line x1="515" y1="400" x2="515" y2="526" stroke="#e67700" stroke-width="2.5" marker-end="url(#g)" stroke-dasharray="6 6"/><rect x="650" y="175" width="190" height="90" rx="12" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="2"/><text x="745" y="212.0" font-size="19" text-anchor="middle" fill="#1e1e1e" font-weight="bold" xml:space="preserve">3  DATOS</text><text x="745" y="240.0" font-size="15" text-anchor="middle" fill="#495057" font-style="italic" xml:space="preserve">¿qué ve el modelo?</text><text x="655" y="292.0" font-size="15" text-anchor="start" fill="#1e1e1e" xml:space="preserve">· lo mínimo necesario</text><text x="655" y="312.25" font-size="15" text-anchor="start" fill="#1e1e1e" xml:space="preserve">· PII enmascarada</text><text x="655" y="332.5" font-size="15" text-anchor="start" fill="#1e1e1e" xml:space="preserve">· RAG filtra por los</text><text x="655" y="352.75" font-size="15" text-anchor="start" fill="#1e1e1e" xml:space="preserve">   permisos del usuario</text><line x1="840" y1="220" x2="876" y2="220" stroke="#1e1e1e" stroke-width="2.5" marker-end="url(#a)"/><line x1="745" y1="400" x2="745" y2="526" stroke="#e67700" stroke-width="2.5" marker-end="url(#g)" stroke-dasharray="6 6"/><rect x="880" y="175" width="190" height="90" rx="12" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/><text x="975" y="212.0" font-size="19" text-anchor="middle" fill="#1e1e1e" font-weight="bold" xml:space="preserve">4  ACCIONES</text><text x="975" y="240.0" font-size="15" text-anchor="middle" fill="#495057" font-style="italic" xml:space="preserve">¿qué puede hacer?</text><text x="885" y="292.0" font-size="15" text-anchor="start" fill="#1e1e1e" xml:space="preserve">· mínimo privilegio</text><text x="885" y="312.25" font-size="15" text-anchor="start" fill="#1e1e1e" xml:space="preserve">· lectura antes que</text><text x="885" y="332.5" font-size="15" text-anchor="start" fill="#1e1e1e" xml:space="preserve">   escritura</text><text x="885" y="352.75" font-size="15" text-anchor="start" fill="#1e1e1e" xml:space="preserve">· args validados (G2)</text><text x="885" y="373.0" font-size="15" text-anchor="start" fill="#1e1e1e" xml:space="preserve">· HITL si hay impacto</text><line x1="1070" y1="220" x2="1106" y2="220" stroke="#1e1e1e" stroke-width="2.5" marker-end="url(#a)"/><line x1="975" y1="400" x2="975" y2="526" stroke="#e67700" stroke-width="2.5" marker-end="url(#g)" stroke-dasharray="6 6"/><rect x="1110" y="175" width="190" height="90" rx="12" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/><text x="1205" y="212.0" font-size="19" text-anchor="middle" fill="#1e1e1e" font-weight="bold" xml:space="preserve">5  SALIDA</text><text x="1205" y="240.0" font-size="15" text-anchor="middle" fill="#495057" font-style="italic" xml:space="preserve">¿qué responde?</text><text x="1115" y="292.0" font-size="15" text-anchor="start" fill="#1e1e1e" xml:space="preserve">· grounding / citas (G3)</text><text x="1115" y="312.25" font-size="15" text-anchor="start" fill="#1e1e1e" xml:space="preserve">· valida el schema</text><text x="1115" y="332.5" font-size="15" text-anchor="start" fill="#1e1e1e" xml:space="preserve">· sin PII ni contenido</text><text x="1115" y="352.75" font-size="15" text-anchor="start" fill="#1e1e1e" xml:space="preserve">   dañino</text><line x1="1300" y1="220" x2="1361" y2="220" stroke="#1e1e1e" stroke-width="2.5" marker-end="url(#a)"/><line x1="1205" y1="400" x2="1205" y2="526" stroke="#e67700" stroke-width="2.5" marker-end="url(#g)" stroke-dasharray="6 6"/><rect x="170" y="530" width="1170" height="85" rx="12" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><text x="190" y="560.0" font-size="18" text-anchor="start" fill="#e67700" font-weight="bold" xml:space="preserve">7  AUDITORÍA  ·  ¿qué queda registrado?</text><text x="190" y="590.0" font-size="15" text-anchor="start" fill="#a85d00" xml:space="preserve">quién pidió  ·  qué datos se usaron  ·  qué respondió el modelo  ·  qué acción se ejecutó  ·  sin PII en claro  ·  CloudTrail + logs</text><text x="750" y="655.0" font-size="15" text-anchor="middle" fill="#495057" font-style="italic" xml:space="preserve">rojo = donde actúan los guardrails (G1, G2, G3)   ·   detecto, pero asumo que falla: limito el daño y todo queda auditado</text></svg>